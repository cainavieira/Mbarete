# O nginx só entrega o estático (ADR-0038).
server {
    listen 8080;
    root /usr/share/nginx/html;
    # Sem a versão do nginx nas respostas
    server_tokens off;

    # Caminho que não é arquivo recebe o index.html, para as rotas do lado do
    # cliente funcionarem ao recarregar a página (ADR-0024)
    location / {
        try_files $uri /index.html;
    }

    # O index.html é conferido a cada visita, para a versão nova chegar logo
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Os arquivos do Vite têm o hash do conteúdo no nome: versão nova tem nome
    # novo, e a antiga pode ficar em cache para sempre. Arquivo que não existe
    # responde 404, e não o index.html
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
