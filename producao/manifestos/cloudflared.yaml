# O conector do túnel da Cloudflare: abre a conexão de saída e entrega ao
# Traefik o que chega por ela (ADR-0006, ADR-0038).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # O perfil restricted do Kubernetes, com os dois campos do contêiner
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          # Versão fixa. Sem a atualização automática, que trocaria o programa
          # por baixo da etiqueta
          image: cloudflare/cloudflared:2026.11.1
          # Para onde vai cada endereço fica no painel da Cloudflare, e o pod
          # só recebe o token
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          # O token do túnel, criado por comando (ADR-0037)
          envFrom:
            - secretRef:
                name: cloudflared
          ports:
            - name: metricas
              containerPort: 2000
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 128Mi
          # Pronto quer dizer conectado à Cloudflare. Sem conferência de vida:
          # com a internet de casa fora, ela reiniciaria o pod em sequência, e a
          # espera entre as tentativas atrasaria a volta do túnel
          readinessProbe:
            httpGet:
              path: /ready
              port: metricas
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
