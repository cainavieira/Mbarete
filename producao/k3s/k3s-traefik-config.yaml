# Valores do Traefik que vem com o k3s. O traefik.yaml original é reescrito
# pelo k3s a cada subida; os ajustes ficam neste arquivo à parte.
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # Roteamento pela Gateway API (ADR-0038)
    providers:
      kubernetesGateway:
        enabled: true
    # Sem porta na VM: só o cloudflared, de dentro do cluster, chega ao Traefik
    service:
      spec:
        type: ClusterIP
    # Os cabeçalhos X-Forwarded que vêm da rede dos pods, onde está o
    # cloudflared, passam adiante. Sem isso, o Traefik troca o https da
    # Cloudflare pelo http dele, e a api monta com http o endereço de volta do
    # login
    ports:
      web:
        forwardedHeaders:
          trustedIPs:
            - 10.42.0.0/16
    # O Gateway que o chart cria aceita rotas só do namespace da aplicação
    gateway:
      listeners:
        web:
          namespacePolicy:
            from: Selector
            selector:
              matchLabels:
                kubernetes.io/metadata.name: mbarete
    # O log de acesso: uma linha em JSON por pedido, na saída do Traefik, de
    # onde o coletor copia (RNF-17)
    logs:
      access:
        enabled: true
        format: json
        # Cabeçalho do pedido fica fora, menos os listados. O Cookie, onde
        # viajam os tokens da sessão, nunca entra
        fields:
          headers:
            defaultmode: drop
            names:
              # O IP de quem acessa, como a Cloudflare viu. O ClientHost traz o
              # X-Forwarded-For, cujo começo o visitante pode inventar
              CF-Connecting-IP: keep
              # Mostra quando quem acessa é um robô
              User-Agent: keep
