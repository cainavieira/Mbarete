spring.application.name=api

# Toda rota da api fica sob /api/v1 (endpoints.md)
server.servlet.context-path=/api/v1

# Endereço e senha do banco chegam por variável de ambiente (convencoes-backend.md).
# Em desenvolvimento, vêm do backend/.env; em produção, do Secret do Kubernetes.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${MBARETE_DB_URL}
spring.datasource.username=${MBARETE_DB_USUARIO}
spring.datasource.password=${MBARETE_DB_SENHA}

# O esquema pertence às migrações (ADR-0036)
spring.jpa.hibernate.ddl-auto=validate
# Consulta só dentro do service (ADR-0036)
spring.jpa.open-in-view=false
# Dialeto fixo: sem ele, banco inacessível aparece como erro de dialeto, e não
# de conexão
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# A api nunca migra ao subir; o modo migrar e os testes ligam (ADR-0040)
spring.flyway.enabled=false

# Log só de erro (RNF-16)
logging.level.root=error
