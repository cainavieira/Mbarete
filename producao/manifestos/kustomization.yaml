# Manifestos da aplicação (ADR-0037). Aplicar com:
#   kubectl apply -k producao/manifestos
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mbarete
resources:
  - namespace.yaml
  - banco.yaml
  - api.yaml
  - frontend.yaml
  - rota.yaml
  - cloudflared.yaml
  - vector.yaml
# A configuração do Vector vira um ConfigMap com o nome seguido de um resumo
# do conteúdo: mudar a configuração muda o nome e troca o pod
configMapGenerator:
  - name: vector
    files:
      - vector.yaml=vector-config.yaml
# A versão em produção, num lugar só: o hash curto do commit de onde as
# imagens saíram
images:
  - name: ghcr.io/cainavieira/mbarete-api
    newTag: 76ff606
  - name: ghcr.io/cainavieira/mbarete-frontend
    newTag: 76ff606
