# A divisão da entrada: /api para a api, o resto para o nginx (ADR-0038).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mbarete
spec:
  # O Gateway que o Traefik cria, aberto a este namespace no
  # k3s-traefik-config.yaml
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 8080
    # Sem condição, a regra vale para todo caminho. O caminho mais longo
    # ganha, então /api fica com a regra de cima
    - backendRefs:
        - name: frontend
          port: 8080
